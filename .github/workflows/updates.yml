name: Check package updates
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/updates.yml'
      - 'scripts/update.py'
      - '*/.upstream.json'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: package-update-checks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [orca, proton_pass, proton_mail, proton_drive, proton_vpn]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure the GitHub bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Open one PR for this package update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ matrix.package }}
        run: |
          gh auth setup-git
          python scripts/update.py "$PACKAGE" --pr --repo "$GH_REPO"
